&lt;div class=&quot;slide-content&quot;&gt;
&lt;h1&gt;当认知产物&lt;br&gt;&lt;em&gt;不再稀缺&lt;/em&gt;&lt;/h1&gt;
&lt;p class=&quot;cover-question&quot;&gt;如果合格成果更容易生成，&lt;br&gt;怎样识别人的贡献？&lt;/p&gt;
&lt;/div&gt;

Note:
先停在问题上，不急于给出结论。这里的认知产物是可交付、可检查、可复用的证明、代码等成果。“合格”以既定要求为准，要求本身也可能有遗漏。题名描述讨论条件，不宣称所有知识成果已经不再稀缺。生成成本也不等于审查、集成、维护和风险控制在内的端到端成本。接下来请观众只根据一份交付物作判断。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;假设案例 · 相同验收要求，结果相近&lt;/p&gt;
&lt;h2&gt;你能分清，&lt;br&gt;两个人做了什么吗？&lt;/h2&gt;
&lt;div class=&quot;comparison artifact-comparison&quot;&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;交付 A · 验收摘录&lt;/p&gt;&lt;h3&gt;已列要求：满足&lt;/h3&gt;&lt;div class=&quot;process-reveal fragment&quot; data-fragment-index=&quot;0&quot;&gt;&lt;p&gt;构造主要推理&lt;br&gt;检查并修正&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;交付 B · 验收摘录&lt;/p&gt;&lt;h3&gt;已列要求：满足&lt;/h3&gt;&lt;div class=&quot;process-reveal fragment&quot; data-fragment-index=&quot;1&quot;&gt;&lt;p&gt;设定目标与约束&lt;br&gt;组织工具生成&lt;br&gt;筛选并修正&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

Note:
先只展示两个相同的验收摘录，问：能据此区分个人贡献吗？再依次揭示两份过程记录。这里不根据独立完成或使用工具来排序，两条路径都可能包含高水平贡献。过程描述也需要核查，不是写下来就可信。成品依然有价值，也提供部分信息，但它未必能独自回答“这个人作过什么判断”。接下来只检查一个判断：发现规格遗漏。

---

&lt;!-- .slide: class=&quot;case-slide&quot; --&gt;
&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;假设案例&lt;/p&gt;
&lt;h2&gt;余额检查通过，&lt;br&gt;能放行吗？&lt;/h2&gt;
&lt;div class=&quot;transaction&quot; aria-label=&quot;账户余额 100，提款 30，剩余 70&quot;&gt;
&lt;div&gt;&lt;span&gt;原余额&lt;/span&gt;&lt;strong&gt;100&lt;/strong&gt;&lt;/div&gt;&lt;span class=&quot;operator&quot; aria-hidden=&quot;true&quot;&gt;−&lt;/span&gt;&lt;div&gt;&lt;span&gt;提款&lt;/span&gt;&lt;strong&gt;30&lt;/strong&gt;&lt;/div&gt;&lt;span class=&quot;operator&quot; aria-hidden=&quot;true&quot;&gt;=&lt;/span&gt;&lt;div&gt;&lt;span&gt;剩余余额&lt;/span&gt;&lt;strong&gt;70&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;property-row&quot;&gt;&lt;span&gt;余额条件&lt;/span&gt;&lt;strong&gt;余额 ≥ 0&lt;/strong&gt;&lt;span class=&quot;pass&quot;&gt;满足&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;property-row missing fragment&quot;&gt;&lt;span&gt;新信息&lt;/span&gt;&lt;strong&gt;提款者没有提款权限&lt;/strong&gt;&lt;span&gt;未授权&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

Note:
请观众先看算式和余额条件，停顿后再揭示提款者没有权限。余额检查通过，为什么仍然不能放行？因为授权是另一项要求。这次计算不是形式化证明，只是一个同时满足余额条件、违背授权条件的反例。能提出这个反例、发现遗漏，是可以进一步核查的贡献。它不代表真实金融系统的完整设计。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;同一案例 · 证明的范围&lt;/p&gt;
&lt;h2&gt;保证跟着&lt;br&gt;规格和假设走&lt;/h2&gt;
&lt;div class=&quot;proof-scope&quot;&gt;
&lt;p class=&quot;scope-label&quot;&gt;&lt;span&gt;给定模型与假设 ·&lt;/span&gt; &lt;span&gt;假设余额性质已有证明&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;scope-covered&quot;&gt;&lt;span&gt;余额非负&lt;/span&gt;&lt;strong&gt;已覆盖&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;scope-outside&quot;&gt;&lt;span&gt;提款须获授权&lt;/span&gt;&lt;strong&gt;未列入原规格&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;scope-revision fragment&quot;&gt;&lt;span&gt;补入授权规格之后&lt;/span&gt;&lt;strong&gt;仍待验证&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;scope-assumption&quot;&gt;&lt;span&gt;假设也要检查：&lt;/span&gt;&lt;span&gt;身份信息可信吗？&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

Note:
延续刚才的反例。即使余额非负在给定模型与假设下已经得到证明，也不能推出遗漏的授权要求正确。揭示补入授权规格后的状态，强调“待验证”：写下要求和证明实现满足要求，是两件事。即使模型内证明完成，身份数据、编译、部署、外部系统和运行环境是否在保证范围内，也需要说明。这些检查可以有工具参与，并非人类的永久特权。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;理解的一个可检查入口&lt;/p&gt;
&lt;h2&gt;换个条件，&lt;br&gt;还说得清吗？&lt;/h2&gt;
&lt;div class=&quot;assumption-example&quot;&gt;&lt;p&gt;前提：0 ≤ 提款额 ≤ 余额&lt;/p&gt;&lt;strong&gt;余额 − 提款额 ≥ 0&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;changed-assumption&quot;&gt;&lt;p class=&quot;fragment&quot; data-fragment-index=&quot;0&quot;&gt;去掉“提款额 ≤ 余额”，会怎样？&lt;/p&gt;&lt;div class=&quot;fragment&quot; data-fragment-index=&quot;1&quot;&gt;&lt;strong&gt;100 − 120 = −20&lt;/strong&gt;&lt;p&gt;原结论失效&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

Note:
证明回答结论是否由前提推出。评价一个人的理解，还可以请他解释前提起什么作用，换一个条件会在哪里失效。这里的简单算例只是演示这种追问，不把答对一次算术当作充分的理解证据。研究中还要问问题为何值得选择、机制如何连接其他理论。问题选择、证明构造和解释可以分别评价，同一个人也可以完成多个环节。工具既能生成结果，也可能帮助形成理解，不从这个区分推出机器不能理解。

---

&lt;!-- .slide: class=&quot;record-slide&quot; --&gt;
&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;示例记录 · 提款授权&lt;/p&gt;
&lt;h2&gt;这次判断，&lt;br&gt;怎样留下证据？&lt;/h2&gt;
&lt;dl class=&quot;contribution-record compact-record&quot;&gt;
&lt;div&gt;&lt;dt&gt;判断&lt;/dt&gt;&lt;dd&gt;余额非负，仍不足以放行&lt;/dd&gt;&lt;/div&gt;
&lt;div class=&quot;fragment&quot; data-fragment-index=&quot;0&quot;&gt;&lt;dt&gt;反例&lt;/dt&gt;&lt;dd&gt;100 − 30 = 70；提款者无权限&lt;/dd&gt;&lt;/div&gt;
&lt;div class=&quot;fragment&quot; data-fragment-index=&quot;1&quot;&gt;&lt;dt&gt;规格与检查&lt;/dt&gt;&lt;dd&gt;已补授权要求；实现检查待完成&lt;/dd&gt;&lt;/div&gt;
&lt;div class=&quot;fragment&quot; data-fragment-index=&quot;2&quot;&gt;&lt;dt&gt;实际分工与工具&lt;/dt&gt;&lt;dd&gt;甲提出反例，乙补写规格&lt;br&gt;工具生成候选实现；审查待完成&lt;/dd&gt;&lt;/div&gt;
&lt;/dl&gt;
&lt;/div&gt;

Note:
逐项填入，而不是展示空洞模板。这是虚构的示例记录，甲、乙是角色占位。真实项目中应把判断连到真实反例、规格变更、检查报告和适用假设，同时如实填写参与者与工具。这里的“待完成”保留了证据缺口，不能冒充已经验证。维护基础设施、组织搜索和解释机制等贡献也应按实际发生记录。无需保存全部思维过程，更不能用文档长度或故事是否漂亮来代替贡献。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;假设的发布安排&lt;/p&gt;
&lt;h2&gt;发现了问题，&lt;br&gt;谁有权叫停？&lt;/h2&gt;
&lt;div class=&quot;release-decision&quot;&gt;&lt;span&gt;授权检查未完成&lt;/span&gt;&lt;strong&gt;发布：暂缓&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;role-assignments&quot;&gt;&lt;div&gt;&lt;h3&gt;谁审查？&lt;/h3&gt;&lt;p&gt;指定审查人，核对证据&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;谁决定发布？&lt;/h3&gt;&lt;p&gt;明确授权与签核责任&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;谁处理后果？&lt;/h3&gt;&lt;p&gt;确定补救负责人&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

Note:
这是假设案例里的组织安排建议，不是某个真实团队的发布记录。发现遗漏可以作为能力证据，但让问题真正阻止发布，还需要有权限的人和明确流程。问责涉及审查义务、发布决定和事后补救，不能简单列为第四种个人技能，也不能只寄望于个人品质。下一页把镜头拉远，看这份实现之外还有哪些工作。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;h2&gt;实现更容易生成，&lt;br&gt;整个项目就更便宜吗？&lt;/h2&gt;
&lt;ol class=&quot;workline focused-workline&quot;&gt;&lt;li&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;确定目标&lt;/h3&gt;&lt;p&gt;允许谁提款？&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;02&lt;/span&gt;&lt;h3&gt;写出约束&lt;/h3&gt;&lt;p&gt;授权、额度&lt;br&gt;失败时的行为&lt;/p&gt;&lt;/li&gt;&lt;li class=&quot;focus-step&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;h3&gt;生成实现&lt;/h3&gt;&lt;p&gt;代码与测试&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;04&lt;/span&gt;&lt;h3&gt;验收与运行&lt;/h3&gt;&lt;p&gt;检查证据&lt;br&gt;处理变更与事故&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;p class=&quot;stage-question&quot;&gt;总成本，仍要看完整过程。&lt;/p&gt;
&lt;/div&gt;

Note:
这四段用相同宽度表示环节，不表示成本比例。这里只突出正在讨论的“生成实现”，没有断言其他环节永远不能自动化。工程评审一直在考察设计、协作与运维，不以代码行数为唯一依据。AI介入以后，需要继续核查分工以及验证、集成、维护的成本是否同步变化。成果更容易生成，是本次讨论的条件，不是从技术演示直接测出的端到端成本结论。

---

&lt;div class=&quot;slide-content source-event&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;真实材料 · First Proof 第 2 题&lt;/p&gt;
&lt;h2&gt;这份证明尝试，&lt;br&gt;经得起检查吗？&lt;/h2&gt;
&lt;div class=&quot;revision-event&quot;&gt;&lt;div&gt;&lt;p&gt;OpenAI 最初判断&lt;/p&gt;&lt;h3&gt;可能正确&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;fragment&quot;&gt;&lt;p&gt;参考官方评论与社区分析后&lt;/p&gt;&lt;h3&gt;OpenAI 改判为错误&lt;/h3&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;source-caption&quot;&gt;有人类提示、反馈与择优；由专家检查，非机器核验。&lt;/p&gt;
&lt;p class=&quot;source-link&quot;&gt;&lt;a href=&quot;https://openai.com/index/first-proof-submissions/&quot;&gt;OpenAI · Our First Proof submissions · 2026-02-20&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;

Note:
这页的对象是一个公开判断的修订，不是用一项错误给整体能力下结论。OpenAI公开了10道研究级数学题的证明尝试，材料记载第2题从最初认为可能正确，经过官方评论与进一步社区分析后改判错误。过程包含人类提示、专家反馈和择优，不是严格受控实验。“可检查”在此指领域专家检查，不等于Lean式机器核验。来源：https://openai.com/index/first-proof-submissions/
另外两份技术背景可供查阅，不共同承担就业或端到端成本结论：
METR，Task-Completion Time Horizons of Frontier AI Models，页面更新2026-05-08。在目标明确、相对独立的软件工程、机器学习和网络安全任务上，任务时间跨度总体上升；时间跨度以人类专家完成任务的耗时衡量难度，不是AI连续运行时长。成功概率不等于全面可靠，超过16小时的估计存在可靠性限制。https://metr.org/time-horizons/
Sebastian Ullrich / Lean FRO，Theorem Proving in Industry with Lean，2026-06-04。展示AI、程序与机器可检查证明进入同一工程流程的案例，各项保证有具体命题、前提与信任边界，不是通用生产率测量。https://lean-lang.org/presentations/20260604_DFMD/

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;情景假设 · 形式化方法&lt;/p&gt;
&lt;h2&gt;一份证明更便宜，&lt;br&gt;总工作量会怎样？&lt;/h2&gt;
&lt;div class=&quot;comparison variable-comparison&quot;&gt;&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;单份成果&lt;/p&gt;&lt;h3&gt;构造成本&lt;br&gt;&lt;em&gt;可能下降&lt;/em&gt;&lt;/h3&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;系统整体&lt;/p&gt;&lt;h3&gt;待验证对象&lt;br&gt;&lt;em&gt;可能增多&lt;/em&gt;&lt;/h3&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;unresolved-result&quot;&gt;净变化：&lt;strong&gt;待定&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;scope-assumption&quot;&gt;&lt;span&gt;还要看规格范围、&lt;/span&gt;&lt;span&gt;可靠性要求与整合成本&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

Note:
两个变化是独立变量，方向是情景假设，不是测得的需求增长。工具生成、核验和修正可能降低单份证明构造成本，更多生成代码、变更与组合也可能增加待验证对象。但不能由此推断验证基础设施或专业人员需求的净增减。Lean工程报告提供技术背景，不直接支持总需求增长。请勿把版面的相同面积或字体大小解释成量化权重。

保留部分专业能力可能有价值，但理由应来自未来需求、重建难度，以及维护和重建成本的比较。过去培养投入是沉没成本，单凭这一点不足以决定继续投入。这里没有支持某种固定岗位、人数或职业名称的方案，也不添加假造的成本数字。技术能力材料无法单独证明某个保留方案值得实施。
