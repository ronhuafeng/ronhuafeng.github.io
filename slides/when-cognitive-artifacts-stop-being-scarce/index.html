&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;数学 · 软件工程 · 形式化方法&lt;/p&gt;
&lt;h1&gt;当认知产物&lt;br&gt;&lt;em&gt;不再稀缺&lt;/em&gt;&lt;/h1&gt;
&lt;p class=&quot;cover-question&quot;&gt;成果更容易生成以后，&lt;br&gt;我们如何识别人的贡献？&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;一个条件论证：假设部分达到既定要求的成果，其生成成本继续下降。&lt;/p&gt;
&lt;/div&gt;

Note:
这里的“认知产物”指可交付、可检查、可复用的证明、代码等成果。标题描述一种讨论条件，不宣称所有知识成果已不再稀缺。生成成本也不等于审查、集成、维护和风险控制在内的端到端成本。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;成果与贡献&lt;/p&gt;
&lt;h2&gt;同样的成果，可以来自&lt;br&gt;不同的贡献路径&lt;/h2&gt;
&lt;div class=&quot;comparison&quot;&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;路径 A&lt;/p&gt;&lt;h3&gt;独立完成主要推理&lt;/h3&gt;&lt;p&gt;构造证明或实现&lt;br&gt;检查并修正自己的结果&lt;/p&gt;&lt;/div&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;路径 B&lt;/p&gt;&lt;h3&gt;组织工具完成任务&lt;/h3&gt;&lt;p&gt;提出目标与约束&lt;br&gt;筛选结果，发现并纠正问题&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;成品质量相近，&lt;strong&gt;个人做过的判断未必相同。&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;示意比较。两条路径都可能包含高水平贡献，成品本身不足以完成归因。&lt;/p&gt;
&lt;/div&gt;

Note:
这里不把独立推理排在工具协作之上，也不把使用工具等同于缺乏能力。主张只是：当得到相近成品的路径更多，评价者需要额外证据，才能判断某个人究竟做了什么。这比“所有成果的能力信号都下降”更有限。

---

&lt;!-- .slide: class=&quot;case-slide&quot; --&gt;
&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;一项具体的判断&lt;/p&gt;
&lt;h2&gt;一笔未经授权的提款，&lt;br&gt;仍然满足余额非负&lt;/h2&gt;
&lt;div class=&quot;transaction&quot; aria-label=&quot;账户余额 100，提款 30，剩余 70&quot;&gt;
&lt;div&gt;&lt;span&gt;原余额&lt;/span&gt;&lt;strong&gt;100&lt;/strong&gt;&lt;/div&gt;&lt;span class=&quot;operator&quot; aria-hidden=&quot;true&quot;&gt;−&lt;/span&gt;&lt;div&gt;&lt;span&gt;提款&lt;/span&gt;&lt;strong&gt;30&lt;/strong&gt;&lt;/div&gt;&lt;span class=&quot;operator&quot; aria-hidden=&quot;true&quot;&gt;=&lt;/span&gt;&lt;div&gt;&lt;span&gt;剩余余额&lt;/span&gt;&lt;strong&gt;70&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;property-row&quot;&gt;&lt;span&gt;已写出的性质&lt;/span&gt;&lt;strong&gt;余额 ≥ 0&lt;/strong&gt;&lt;span class=&quot;pass&quot;&gt;满足&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;property-row missing fragment&quot;&gt;&lt;span&gt;遗漏的要求&lt;/span&gt;&lt;strong&gt;提款者有合法授权&lt;/strong&gt;&lt;span&gt;不满足&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;footnote&quot;&gt;示意例，仅讨论一个性质。数字帮助展示反例，不代表真实金融系统。&lt;/p&gt;
&lt;/div&gt;

Note:
可先展示余额非负的性质，再揭示授权要求。即使实现对所有模型内行为都满足余额非负，也无法据此推出提款授权正确。这里不把一次计算当作形式化证明，计算只展示两个性质可以分离。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;验证的边界&lt;/p&gt;
&lt;h2&gt;证明覆盖的是&lt;br&gt;&lt;em&gt;已经写下来的要求&lt;/em&gt;&lt;/h2&gt;
&lt;div class=&quot;boundary-statement&quot;&gt;&lt;p&gt;在给定模型与假设下，&lt;/p&gt;&lt;p&gt;&lt;strong&gt;实现满足规格&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;split-notes&quot;&gt;&lt;div&gt;&lt;h3&gt;规格需要检查&lt;/h3&gt;&lt;p&gt;是否遗漏授权？&lt;br&gt;是否表达了真正的目标？&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;假设需要检查&lt;/h3&gt;&lt;p&gt;身份信息是否可信？&lt;br&gt;运行环境是否符合模型？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;footnote&quot;&gt;证明的范围与现实中的目标、环境之间，仍然需要可检查的连接。&lt;/p&gt;
&lt;/div&gt;

Note:
形式化验证提供的保证依赖所采用的模型、规格与假设。编译、部署、外部系统和运行时环境是否在保证范围内，需要明确说明。自动化也可以帮助检查规格与假设，本页没有主张这些工作只能由人完成。

---

&lt;!-- .slide: class=&quot;thesis-slide&quot; --&gt;
&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;核心判断&lt;/p&gt;
&lt;h2&gt;生成路径变多以后，&lt;br&gt;仅看成品难以回答&lt;br&gt;&lt;em&gt;“这个人贡献了什么？”&lt;/em&gt;&lt;/h2&gt;
&lt;p class=&quot;thesis-support&quot;&gt;评审、招聘与晋升若要识别个人贡献，&lt;br&gt;就需要成品之外的证据。&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;条件推论。它没有直接给出职业数量、收入分配或人的永久优势。&lt;/p&gt;
&lt;/div&gt;

Note:
生成方式变化与个人能力信号的关系，需要通过贡献路径来解释，而不是仅从成本下降跳到“人的判断更值钱”。成果仍有使用价值，也仍能提供部分信息。更准确的变化是：成品作为个人贡献的唯一依据可能不够。

---

&lt;div class=&quot;slide-content evidence-slide&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;能力变化的背景&lt;/p&gt;
&lt;h2&gt;三份材料，三个观察窗口&lt;/h2&gt;
&lt;div class=&quot;evidence-list&quot;&gt;
&lt;div&gt;&lt;span class=&quot;evidence-index&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;a href=&quot;https://metr.org/time-horizons/&quot;&gt;METR · 任务时间跨度&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;在一组目标明确、相对独立的技术任务上，AI agent 可完成的任务跨度总体上升。&lt;/p&gt;&lt;p class=&quot;qualification&quot;&gt;以人类专家耗时衡量任务难度，不是 AI 的连续运行时长。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;span class=&quot;evidence-index&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;a href=&quot;https://openai.com/index/first-proof-submissions/&quot;&gt;OpenAI · First Proof&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;公开研究级数学题的完整证明尝试，接受领域专家检查。&lt;/p&gt;&lt;p class=&quot;qualification&quot;&gt;有人类提示、反馈与择优选择，不是严格控制实验。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;span class=&quot;evidence-index&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;a href=&quot;https://lean-lang.org/presentations/20260604_DFMD/&quot;&gt;Lean FRO · 工程案例&lt;/a&gt;&lt;/h3&gt;&lt;p&gt;展示 AI、程序和机器可检查的证明如何进入同一工程流程。&lt;/p&gt;&lt;p class=&quot;qualification&quot;&gt;案例与工具进展介绍，不是通用生产率测量。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;footnote&quot;&gt;这些材料提供技术背景；并未直接测量端到端成本、工资或就业变化。&lt;/p&gt;
&lt;/div&gt;

Note:
METR：Task-Completion Time Horizons of Frontier AI Models，页面更新于 2026-05-08。任务主要来自软件工程、机器学习和网络安全，通常比真实工作更清晰、独立。成功概率不能解释为全面可靠，超过 16 小时的估计有明确可靠性限制。https://metr.org/time-horizons/
OpenAI：Our First Proof submissions，2026-02-20。首次提交公开于 2026-02-14。报告中的正确性判断存在不确定性并有修订。这里的可检查证明指专家检查，不代表 Lean 式机器核验。https://openai.com/index/first-proof-submissions/
Sebastian Ullrich / Lean FRO：Theorem Proving in Industry with Lean，Dutch Formal Methods Day，2026-06-04。案例中的保证均有具体命题、前提和信任边界。https://lean-lang.org/presentations/20260604_DFMD/

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;数学&lt;/p&gt;
&lt;h2&gt;正确证明与理解，需要不同的证据&lt;/h2&gt;
&lt;div class=&quot;comparison unequal&quot;&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;证明回答&lt;/p&gt;&lt;h3 class=&quot;large-claim&quot;&gt;结论是否&lt;br&gt;由前提推出？&lt;/h3&gt;&lt;/div&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;理解还要回答&lt;/p&gt;&lt;ul class=&quot;plain-list&quot;&gt;&lt;li&gt;哪个机制真正起作用？&lt;/li&gt;&lt;li&gt;换一个假设，哪里会失效？&lt;/li&gt;&lt;li&gt;它与已有理论如何连接？&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;问题选择、证明构造和解释，&lt;strong&gt;可以分别评价。&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;同一个人可能完成多个环节，使用工具也可能帮助形成理解。&lt;/p&gt;
&lt;/div&gt;

Note:
不从“证明不等于理解”推导“机器不能理解”。这里是在区分需要不同证据的评价对象：证明有效、作者理解、问题值得研究。复述一个结果不一定足够，解释关键机制、适用范围和相邻反例能提供更多信息。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;软件工程&lt;/p&gt;
&lt;h2&gt;实现只是&lt;br&gt;需求到运行的一段&lt;/h2&gt;
&lt;ol class=&quot;workline&quot;&gt;&lt;li&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;确定目标&lt;/h3&gt;&lt;p&gt;允许谁提款？&lt;br&gt;保护谁的权益？&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;02&lt;/span&gt;&lt;h3&gt;写出约束&lt;/h3&gt;&lt;p&gt;授权与额度&lt;br&gt;失败时的行为&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;03&lt;/span&gt;&lt;h3&gt;生成实现&lt;/h3&gt;&lt;p&gt;代码与测试&lt;br&gt;集成到系统&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;04&lt;/span&gt;&lt;h3&gt;验收与运行&lt;/h3&gt;&lt;p&gt;检查证据&lt;br&gt;处理变更与事故&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;p class=&quot;takeaway&quot;&gt;实现更容易生成时，&lt;strong&gt;项目总成本仍取决于整个过程。&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;这些工作一直存在。需要重新辨认的是谁做了什么，以及各环节的成本如何变化。&lt;/p&gt;
&lt;/div&gt;

Note:
工程评审一直在考察设计、协作和运维，不以代码行数为唯一评价标准。AI 介入以后，重点是原有证据是否仍能准确反映分工，以及验证、集成、维护的成本是否随生成成本同步下降。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;形式化方法&lt;/p&gt;
&lt;h2&gt;证明构造与验证需求可以同时变化&lt;/h2&gt;
&lt;div class=&quot;comparison&quot;&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;单份成果&lt;/p&gt;&lt;h3&gt;构造证明的成本&lt;br&gt;可能下降&lt;/h3&gt;&lt;p&gt;工具生成候选证明&lt;br&gt;检查器返回结果&lt;br&gt;据此修改候选&lt;/p&gt;&lt;/div&gt;
&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;系统整体&lt;/p&gt;&lt;h3&gt;需要验证的对象&lt;br&gt;可能增多&lt;/h3&gt;&lt;p&gt;更多生成代码&lt;br&gt;更多变更与组合&lt;br&gt;更多需要明确的保证&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;总工作量如何变化，&lt;strong&gt;还取决于规模、范围与可靠性要求。&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;可能的机制，不是已测得的需求增长。技术背景：&lt;a href=&quot;https://lean-lang.org/presentations/20260604_DFMD/&quot;&gt;Lean FRO 工程报告&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;

Note:
生成、核验和修正可以形成自动化循环，但不能由此推断验证基础设施或专业人员需求的净增减。部署更多验证也不等于每份证明更贵。需分别看单位成本、对象数量、规格范围、核验可靠性和工程整合成本。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;评价对象&lt;/p&gt;
&lt;h2&gt;能力需要证据，责任需要安排&lt;/h2&gt;
&lt;div class=&quot;ability-list&quot;&gt;&lt;div&gt;&lt;h3&gt;判断&lt;/h3&gt;&lt;p&gt;为何选这个问题？为何接受这个结果？&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;规格表达&lt;/h3&gt;&lt;p&gt;目标和约束写在哪里？遗漏如何发现？&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;理解与解释&lt;/h3&gt;&lt;p&gt;为何成立？换了条件，结论还能用吗？&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;responsibility&quot;&gt;&lt;h3&gt;责任机制&lt;/h3&gt;&lt;p&gt;谁有权决定，谁负责审查，谁发布，谁补救？&lt;/p&gt;&lt;/div&gt;
&lt;p class=&quot;footnote&quot;&gt;前三项是需要识别的能力。问责还依赖权限、流程和组织安排，不能只靠个人品质。&lt;/p&gt;
&lt;/div&gt;

Note:
这些能力并非因为 AI 才出现，也不意味着它们天然或永久属于人类。把它们从最终成品中拆出来评价，是为了让贡献可以被看见。Accountability 涉及角色权限、审查义务、发布决定和事后补救，不能简单列成第四种个人技能。

---

&lt;!-- .slide: class=&quot;record-slide&quot; --&gt;
&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;一个可用的做法&lt;/p&gt;
&lt;h2&gt;成品旁边，留下一份贡献记录&lt;/h2&gt;
&lt;p class=&quot;intro&quot;&gt;以提款授权为例，一次关键判断可以这样记录：&lt;/p&gt;
&lt;dl class=&quot;contribution-record&quot;&gt;&lt;div&gt;&lt;dt&gt;作了什么判断&lt;/dt&gt;&lt;dd&gt;“余额非负”不足以保护账户，还需检查授权。&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;依据是什么&lt;/dt&gt;&lt;dd&gt;构造余额仍为正、但提款者无权限的反例。&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;留下什么证据&lt;/dt&gt;&lt;dd&gt;补充授权规格，并关联检查结果及适用假设。&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;贡献如何区分&lt;/dt&gt;&lt;dd&gt;分别标明问题提出、生成、审查与发布决定。&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;
&lt;p class=&quot;takeaway&quot;&gt;评价具体贡献，&lt;strong&gt;也记录工具参与和证据的边界。&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;示例模板，不是实际项目记录。它可以用于评审、招聘讨论和项目复盘。&lt;/p&gt;
&lt;/div&gt;

Note:
记录应简短，指向真实规格、反例、检查报告或决策记录，不以“写得很完整”代替事实。还应保留维护基础设施、组织搜索和解释机制等实际贡献。对于重要发布，需明确决策者与补救安排。没有要求保存全部推理过程，也不把冗长过程文档当作新的绩效指标。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;培养路径&lt;/p&gt;
&lt;h2&gt;常规任务减少时，&lt;br&gt;判断练习需要有意保留&lt;/h2&gt;
&lt;p class=&quot;intro&quot;&gt;如果常规任务减少，新人获得反馈的机会也可能改变。&lt;/p&gt;
&lt;ol class=&quot;practice-list&quot;&gt;&lt;li&gt;&lt;span&gt;预测&lt;/span&gt;&lt;p&gt;使用工具前，先判断结果应该满足什么。&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;检查&lt;/span&gt;&lt;p&gt;解释失败和反例，定位遗漏的约束。&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;修正&lt;/span&gt;&lt;p&gt;修改后验证，再跟踪真实运行中的变化。&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;p class=&quot;takeaway&quot;&gt;培养要保留&lt;strong&gt;作判断、获得反馈、承担适当责任&lt;/strong&gt;的机会。&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;培养风险与设计建议；不意味着新人岗位必然减少，也不排除 AI 帮助学习。&lt;/p&gt;
&lt;/div&gt;

Note:
原有小任务、调试、维护和事故处理常为学习提供反馈。如果这些工作形式变化，组织应观察学习结果并设计替代练习，而不是机械保留低效劳动。练习需要适当的真实约束、逐步提高的自主权和可靠指导。

---

&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;制度选择&lt;/p&gt;
&lt;h2&gt;专业能力的保留，需要面向未来的理由&lt;/h2&gt;
&lt;div class=&quot;comparison unequal&quot;&gt;&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;已经发生的投入&lt;/p&gt;&lt;h3&gt;“培养了很多年”&lt;/h3&gt;&lt;p&gt;单凭过去的成本，&lt;br&gt;不足以决定继续投入。&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;仍需评估的条件&lt;/p&gt;&lt;ul class=&quot;plain-list&quot;&gt;&lt;li&gt;未来是否仍可能需要？&lt;/li&gt;&lt;li&gt;失去后是否难以重建？&lt;/li&gt;&lt;li&gt;保留与重建各有什么成本？&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;在这些条件下，&lt;strong&gt;保留部分能力可能有价值。&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;条件性的制度建议，不直接推导维持某种岗位、人数或职业名称。&lt;/p&gt;
&lt;/div&gt;

Note:
保留专业能力的理由，应来自未来需求与重建难度。能力的未来需求、重建周期以及持续维护成本，必须分别评估。技术能力材料无法单独证明某一保留方案值得实施。

---

&lt;div class=&quot;slide-content limits-slide&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;论证走到哪里&lt;/p&gt;
&lt;h2&gt;重新识别贡献，&lt;br&gt;不必等待职业预测&lt;/h2&gt;
&lt;div class=&quot;comparison&quot;&gt;&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;可以提出的调整&lt;/p&gt;&lt;h3&gt;让评价更具体&lt;/h3&gt;&lt;p&gt;区分选择、生成、验证与解释&lt;br&gt;观察能力如何形成&lt;br&gt;明确重要决策的责任安排&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;column-label&quot;&gt;还需要独立证据&lt;/p&gt;&lt;h3&gt;就业与收入如何变化&lt;/h3&gt;&lt;p&gt;岗位总数是否增减&lt;br&gt;哪些能力获得更高回报&lt;br&gt;谁能长期保有比较优势&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;成果依然有价值。&lt;strong&gt;评价成果与评价贡献，需要不同的信息。&lt;/strong&gt;&lt;/p&gt;
&lt;/div&gt;

Note:
不预测所有职业消失，也不声称人类天然更擅长判断或规格表达。职业身份可能随实际分工变化，但命名不能代替机制解释。是否“为某种人类能力付费”仍是开放的制度问题。

---

&lt;!-- .slide: class=&quot;closing-slide&quot; --&gt;
&lt;div class=&quot;slide-content&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;留下的一个问题&lt;/p&gt;
&lt;h2&gt;当成果更容易获得，&lt;br&gt;我们如何让&lt;br&gt;&lt;em&gt;贡献也清楚可见？&lt;/em&gt;&lt;/h2&gt;
&lt;p class=&quot;closing-line&quot;&gt;谁作了什么判断？&lt;br&gt;依据是什么？&lt;br&gt;出了问题，由谁处理？&lt;/p&gt;
&lt;p class=&quot;footnote&quot;&gt;评价贡献 · 培养能力 · 安排责任&lt;/p&gt;
&lt;/div&gt;
