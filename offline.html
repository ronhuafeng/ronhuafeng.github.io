<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <meta name="robots" content="noindex" />
    <title>离线 / Offline - 張華楓's Notes</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fbfaf8;
        --ink: #151515;
        --muted: #5b5b5b;
        --border: rgba(0, 0, 0, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding:
          max(2rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(2rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      main { width: min(100%, 34rem); }
      h1 {
        margin: 0 0 1rem;
        font-family: "Iowan Old Style", Baskerville, "Times New Roman", "Songti SC", serif;
        font-size: clamp(2.2rem, 8vw, 3.6rem);
        line-height: 1.05;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      button, a {
        min-height: 2.75rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button { background: var(--ink); color: var(--paper); border-color: var(--ink); }
      a { background: transparent; color: var(--ink); }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0f0f10;
          --ink: #f5f5f5;
          --muted: #b0b0b0;
          --border: rgba(255, 255, 255, 0.16);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前离线</h1>
      <p>已经打开过的文章仍可离线阅读。网络恢复后，刷新页面即可获取最新内容。</p>
      <p lang="en">You're offline. Articles you have already opened remain available from the reading cache.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">重新连接 / Retry</button>
        <a href="/">返回首页 / Home</a>
      </div>
    </main>
  </body>
</html>
