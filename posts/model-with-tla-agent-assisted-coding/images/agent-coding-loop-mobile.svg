<svg xmlns="http://www.w3.org/2000/svg" width="520" height="924" viewBox="0 0 520 924" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif"><title id="title">移动端：常规 Agent coding loop</title><desc id="desc">由需求依次到生成实现、编写测试、执行测试、失败后修改代码，并说明测试覆盖的隐含前提。</desc><defs><marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8a8d94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#08786c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="1" y="1" width="518" height="922" rx="24" fill="#ffffff" stroke="#dcdfe4" stroke-width="2"/></g><g id="edges"><path d="M260 227 V245" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-0"/><path d="M260 348 V366" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-1"/><path d="M260 469 V487" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-2"/><path d="M260 590 V608" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-3"/><line x1="42" y1="773" x2="478" y2="773" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="divider"/></g><g id="semantic-elements"><text x="34" y="58" font-size="28" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="diagram-title">Agent coding loop</text><text x="34" y="95" font-size="18" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="diagram-subtitle">常规反馈循环</text><rect x="48" y="136" width="424" height="86" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-1"/><text x="260" y="191" font-size="26" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-0">需求</text><rect x="48" y="257" width="424" height="86" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-2"/><text x="260" y="312" font-size="26" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-1">生成实现</text><rect x="48" y="378" width="424" height="86" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-3"/><text x="260" y="433" font-size="26" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-2">编写测试</text><rect x="48" y="499" width="424" height="86" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-4"/><text x="260" y="554" font-size="26" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-3">执行测试</text><rect x="48" y="620" width="424" height="86" rx="15" fill="#eef8f5" stroke="#a7d1c7" stroke-width="1.5" data-semantic-id="step-5"/><text x="260" y="675" font-size="26" fill="#08786c" font-weight="650" text-anchor="middle" data-semantic-id="step-label-4">根据失败修改代码</text><text x="260" y="737" font-size="19" fill="#08786c" font-weight="500" text-anchor="middle" data-semantic-id="feedback">失败后返回实现与测试环节</text><text x="48" y="817" font-size="23" fill="#d64944" font-weight="700" text-anchor="start" data-semantic-id="assumption-title">隐含前提</text><text x="166" y="817" font-size="20" fill="#17191d" font-weight="600" text-anchor="start" data-semantic-id="assumption">重要错误已被测试表达</text><text x="48" y="859" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="limit-1">未进入测试的事件交错</tex