<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="864" viewBox="0 0 1180 864" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif"><title id="title">为什么模型通过不等于实现已验证</title><desc id="desc">五层证据来源必须在身份、动作、外部副作用和终态语义上匹配。完成状态从闭合、有限适用、漂移、阻断或未证明等类别中确定。</desc><defs><marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8a8d94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#08786c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="1" y="1" width="1178" height="862" rx="24" fill="#ffffff" stroke="#dcdfe4" stroke-width="2"/></g><g id="edges"><line x1="561" y1="170" x2="561" y2="223" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="layer-divider-0"/><line x1="561" y1="274" x2="561" y2="327" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="layer-divider-1"/><line x1="561" y1="378" x2="561" y2="431" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="layer-divider-2"/><line x1="561" y1="482" x2="561" y2="535" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="layer-divider-3"/><line x1="561" y1="586" x2="561" y2="639" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="layer-divider-4"/><line x1="43" y1="711" x2="1138" y2="711" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="footer-divider"/></g><g id="semantic-elements"><text x="48" y="68" font-size="32" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="diagram-title">模型通过 ≠ 实现已验证</text><text x="48" y="108" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="diagram-subtitle">五种证据来源互相补充，不能用上一层的 PASS 代替下一层</text><rect x="41" y="153" width="1098" height="87" rx="15" fill="#f6f8fc" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-0"/><circle cx="85" cy="196.5" r="24" fill="#ebf1fa" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="num-circle-0"/><text x="85" y="203.5" font-size="18" fill="#62666d" font-weight="700" text-anchor="middle" data-semantic-id="num-0">01</text><text x="133" y="205" font-size="23" fill="#17191d" font-weight="650" text-anchor="start" data-semantic-id="layer-name-0">Requirements model</text><text x="595" y="206" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="layer-desc-0">定义允许与禁止的抽象行为</text><rect x="41" y="257" width="1098" height="87" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-1"/><circle cx="85" cy="300.5" r="24" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="num-circle-1"/><text x="85" y="307.5" font-size="18" fill="#62666d" font-weight="700" text-anchor="middle" data-semantic-id="num-1">02</text><text x="133" y="309" font-size="23" fill="#17191d" font-weight="650" text-anchor="start" data-semantic-id="layer-name-1">Refinement / focused obligation</text><text x="595" y="310" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="layer-desc-1">检查低层映射或一个关键边界</text><rect x="41" y="361" width="1098" height="87" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-2"/><circle cx="85" cy="404.5" r="24" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="num-circle-2"/><text x="85" y="411.5" font-size="18" fill="#62666d" font-weight="700" text-anchor="middle" data-semantic-id="num-2">03</text><text x="133" y="413" font-size="23" fill="#17191d" font-weight="650" text-anchor="start" data-semantic-id="layer-name-2">Controlled implementation trace</text><text x="595" y="414" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="layer-desc-2">用受控调度验证实现中的事件顺序</text><rect x="41" y="465" width="1098" height="87" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-3"/><circle cx="85" cy="508.5" r="24" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="num-circle-3"/><text x="85" y="515.5" font-size="18" fill="#62666d" font-weight="700" text-anchor="middle" data-semantic-id="num-3">04</text><text x="133" y="517" font-size="23" fill="#17191d" font-weight="650" text-anchor="start" data-semantic-id="layer-name-3">External evidence</text><text x="595" y="518" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="layer-desc-3">确认外部系统的事实及环境假设</text><rect x="41" y="569" width="1098" height="87" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-4"/><circle cx="85" cy="612.5" r="24" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="num-circle-4"/><text x="85" y="619.5" font-size="18" fill="#62666d" font-weight="700" text-anchor="middle" data-semantic-id="num-4">05</text><text x="133" y="621" font-size="23" fill="#17191d" font-weight="650" text-anchor="start" data-semantic-id="layer-name-4">Convergence observation</text><text x="595" y="622" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="layer-desc-4">观察稳定、如实的最终状态</text><text x="51" y="757" font-size="22" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="status-heading">结论分类</text><text x="193" y="757" font-size="23" fill="#08786c" font-weight="600" text-anchor="start" data-semantic-id="status-label">closed / scoped / drifted / blocked / unproved</text><text x="51" y="811" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="status-explain">只有与声明范围对应的证据齐备，才能说某项检查已闭合。</text></g><g id="annotations"></g></svg>