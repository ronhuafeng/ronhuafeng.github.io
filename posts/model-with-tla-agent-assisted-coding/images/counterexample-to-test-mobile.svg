<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1100" viewBox="0 0 520 1100" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif"><title id="title">移动端：TLC 反例转化为受控回归测试</title><desc id="desc">依次解释 TLC 轨迹、领域事件、代码位置与受控测试中的同一故障。</desc><defs><marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8a8d94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#08786c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="1" y="1" width="518" height="1098" rx="24" fill="#ffffff" stroke="#dcdfe4" stroke-width="2"/></g><g id="edges"><path d="M260 315 V331" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="step-link-0"/><path d="M260 519 V535" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="step-link-1"/><path d="M260 723 V739" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="step-link-2"/><line x1="39" y1="966" x2="481" y2="966" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="divider"/></g><g id="semantic-elements"><text x="34" y="58" font-size="28" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="diagram-title">从反例到回归测试</text><text x="34" y="95" font-size="18" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="diagram-subtitle">每一层保留同一条故障轨迹</text><rect x="43" y="137" width="434" height="175" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-0"/><text x="67" y="174" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-0">01</text><text x="67" y="214" font-size="26" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="name-0">TLC 反例</text><text x="67" y="251" font-size="21" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="detail-a-0">旧操作仍在运行</text><text x="67" y="285" font-size="21" fill="#d64944" font-weight="600" text-anchor="start" data-semantic-id="detail-b-0">违反提交权限性质</text><rect x="43" y="341" width="434" height="175" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-1"/><text x="67" y="378" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-1">02</text><text x="67" y="418" font-size="26" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="name-1">领域事件</text><text x="67" y="455" font-size="21" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="detail-a-1">启动旧操作 → 替换资源</text><text x="67" y="489" font-size="21" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="detail-b-1">→ 旧回调到达</text><rect x="43" y="545" width="434" height="175" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-2"/><text x="67" y="582" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-2">03</text><text x="67" y="622" font-size="26" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="name-2">实现边界</text><text x="67" y="659" font-size="21" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="detail-a-2">定位 callback handler</text><text x="67" y="693" font-size="21" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="detail-b-2">与 commit guard</text><rect x="43" y="749" width="434" height="175" rx="15" fill="#eef8f5" stroke="#a7d1c7" stroke-width="1.5" data-semantic-id="step-3"/><text x="67" y="786" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-3">04</text><text x="67" y="826" font-size="26" fill="#08786c" font-weight="700" text-anchor="start" data-semantic-id="name-3">受控回归测试</text><text x="67" y="863" font-size="21" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="detail-a-3">暂停回调 → 替换资源</text><text x="67" y="897" font-size="21" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="detail-b-3">释放回调 → 检查状态</text><text x="42" y="1010" font-size="22" fill="#08786c" font-weight="700" text-anchor="start" data-semantic-id="head">检查重点</text><text x="42" y="1045" font-size="21" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="summary">身份、事件顺序和性质必须对应。</text><text x="42" y="1076" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="warning">正常路径通过 ≠ 反例已覆盖。</text></g><g id="annotations"></g></svg>