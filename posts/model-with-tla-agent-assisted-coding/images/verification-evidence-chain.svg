<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="title desc">
  <title id="title">model-with-tla 的验证证据链</title>
  <desc id="desc">Requirements / Behavioral Contract 经过 TLA+ requirements model、TLC model checking、refinement / implementation mapping，最终到达 controlled tests / external evidence。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="798" rx="24" fill="#fbfdff" stroke="#e2e8f0" stroke-width="2"/>
  <g text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif">
    <rect x="90" y="36" width="820" height="108" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="500" y="79" font-size="26" font-weight="700" fill="#0f172a">Requirements / Behavioral Contract</text>
    <text x="500" y="115" font-size="19" fill="#475569">先定义系统必须满足的行为，而不是复制当前实现</text>
    <path d="M500 149 V173" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
    <rect x="90" y="183" width="820" height="108" rx="16" fill="#eaf5ff" stroke="#9bc6ed" stroke-width="2"/>
    <text x="500" y="226" font-size="26" font-weight="700" fill="#14528b">TLA+ Requirements Model</text>
    <text x="500" y="261" font-size="19" fill="#40657e">Init · Next · Safety · Liveness · Fairness</text>
    <path d="M500 296 V320" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
    <rect x="90" y="330" width="820" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="500" y="373" font-size="26" font-weight="700" fill="#0f172a">TLC Model Checking</text>
    <text x="500" y="407" font-size="19" fill="#475569">探索状态空间 · 检查性质 · 生成 Counterexample</text>
    <path d="M500 443 V467" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
    <rect x="90" y="477" width="820" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="500" y="520" font-size="26" font-weight="700" fill="#0f172a">Refinement / Implementation Mapping</text>
    <text x="500" y="554" font-size="19" fill="#475569">把抽象操作映射到真实代码中的决策点和状态变化</text>
    <path d="M500 590 V614" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
    <rect x="90" y="624" width="820" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="500" y="667" font-size="26" font-weight="700" fill="#0f172a">Controlled Tests / External Evidence</text>
    <text x="500" y="701" font-size="19" fill="#475569">重现事件顺序 · 验证修复 · 标注未验证假设</text>
  </g>
</svg>