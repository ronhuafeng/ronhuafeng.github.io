<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 857" width="760" height="857" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="title desc"><title id="title">为什么 TLC PASS 仍可能没有检查到目标错误</title><desc id="desc">左侧的目标域只含 primary，alternate 无法表示，因此 NoAlternateTarget 会通过。右侧包含 alternate，错误动作可触发预期不变量失败，修正后同一目标性质在正向配置下通过。</desc><defs><marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0b8278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#bc662d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="0" y="0" width="760" height="857" rx="23" fill="#fcfdff" stroke="#e2e8f0" stroke-width="2"/></g><g id="relationships"><path d="M197 438 V474" fill="none" stroke="#64748b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="left-domain-&gt;check"/><path d="M197 552 V587" fill="none" stroke="#64748b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="left-check-&gt;result"/><path d="M564 347 V365 H490 V391" fill="none" stroke="#bc662d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" data-semantic-id="right-domain-&gt;fault"/><path d="M564 365 H642 V391" fill="none" stroke="#64748b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="right-domain-&gt;corrected"/><path d="M490 467 V505" fill="none" stroke="#bc662d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" data-semantic-id="fault-&gt;failure"/><path d="M642 467 V505" fill="none" stroke="#64748b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="corrected-&gt;success"/></g><g id="semantic-nodes"><text x="31" y="57" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start" data-semantic-id="headline">为什么 TLC PASS 仍可能没有意义？</text><text x="32" y="90" font-size="19" fill="#64748b" font-weight="400" text-anchor="start" data-semantic-id="subtitle">Safety discriminability：能否表达、触发并识别错误</text><rect x="25" y="118" width="344" height="649" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" data-semantic-id="vacuous-panel"/><rect x="392" y="118" width="343" height="649" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" data-semantic-id="adequate-panel"/><text x="197" y="166" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="vacuous-heading">只看正向通过</text><text x="564" y="166" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="adequate-heading">正向 + 负向见证</text><rect x="49" y="204" width="296" height="143" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.8" data-semantic-id="domain-left"/><text x="197" y="239" font-size="22" fill="#0f172a" font-weight="600" text-anchor="middle" data-semantic-id="domain-left-label">Targets = { primary }</text><rect x="122" y="258" width="150" height="52" rx="10" fill="#e5f5f2" stroke="#8bc8bd" stroke-width="1.6" data-semantic-id="primary-left"/><text x="197" y="291" font-size="22" fill="#0f766e" font-weight="600" text-anchor="middle" data-semantic-id="primary-left-text">primary</text><rect x="61" y="369" width="270" height="69" rx="11" fill="#fff" stroke="#bdc7d2" stroke-width="1.6" data-semantic-id="outside-forbidden" stroke-dasharray="6 6"/><text x="197" y="396" font-size="21" fill="#64748b" font-weight="500" text-anchor="middle" data-semantic-id="outside-forbidden-text">alternate</text><text x="197" y="421" font-size="18" fill="#64748b" font-weight="400" text-anchor="middle" data-semantic-id="outside-note">不在模型取值域内</text><rect x="59" y="484" width="276" height="68" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2" data-semantic-id="left-tlc"/><text x="197" y="524.8" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="left-tlc:title">检查 NoAlternateTarget</text><rect x="89" y="598" width="216" height="66" rx="14" fill="#eaf7f0" stroke="#9ed3b4" stroke-width="2" data-semantic-id="left-pass"/><text x="197" y="638.82" font-size="23" fill="#16734d" font-weight="700" text-anchor="middle" data-semantic-id="left-pass:title">TLC PASS</text><text x="197" y="706" font-size="21" fill="#a35125" font-weight="700" text-anchor="middle" data-semantic-id="vacuity-claim">错误根本无法发生</text><text x="197" y="738" font-size="18" fill="#a35125" font-weight="400" text-anchor="middle" data-semantic-id="vacuity-explain">通过不能支持这个性质</text><rect x="415" y="204" width="297" height="143" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.8" data-semantic-id="domain-right"/><text x="564" y="238" font-size="22" fill="#0f172a" font-weight="600" text-anchor="middle" data-semantic-id="domain-right-label">Targets = {</text><rect x="428" y="260" width="126" height="51" rx="10" fill="#e5f5f2" stroke="#8bc8bd" stroke-width="1.6" data-semantic-id="primary-right"/><text x="491" y="291" font-size="20" fill="#0f766e" font-weight="600" text-anchor="middle" data-semantic-id="primary-right-text">primary</text><rect x="573" y="260" width="126" height="51" rx="10" fill="#fff0e5" stroke="#e4aa7a" stroke-width="1.6" data-semantic-id="alternate-right"/><text x="636" y="291" font-size="20" fill="#a35125" font-weight="600" text-anchor="middle" data-semantic-id="alternate-right-text">alternate</text><text x="564" y="329" font-size="22" fill="#0f172a" font-weight="600" text-anchor="middle" data-semantic-id="domain-right-close">}</text><rect x="418" y="401" width="144" height="66" rx="14" fill="#fff4e9" stroke="#edbc93" stroke-width="2" data-semantic-id="fault"/><text x="490" y="441.14" font-size="21" fill="#a35125" font-weight="700" text-anchor="middle" data-semantic-id="fault:title">错误动作</text><text x="490" y="490" font-size="18" fill="#a35125" font-weight="400" text-anchor="middle" data-semantic-id="fault-action">选择 alternate</text><rect x="418" y="517" width="144" height="72" rx="14" fill="#fff0e5" stroke="#edbc93" stroke-width="2" data-semantic-id="failure"/><text x="490" y="552" font-size="24" fill="#a35125" font-weight="700" text-anchor="middle" data-semantic-id="failure:title">FAIL</text><text x="490" y="581" font-size="17" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="failure:detail">预期违反性质</text><rect x="575" y="401" width="135" height="66" rx="14" fill="#ecf5ff" stroke="#a5c8ed" stroke-width="2" data-semantic-id="corrected"/><text x="642.5" y="441.14" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="corrected:title">修正动作</text><text x="642" y="490" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="corrected-action">阻止错误选择</text><rect x="575" y="517" width="135" height="72" rx="14" fill="#eaf7f0" stroke="#9ed3b4" stroke-width="2" data-semantic-id="success"/><text x="642.5" y="552" font-size="24" fill="#16734d" font-weight="700" text-anchor="middle" data-semantic-id="success:title">PASS</text><text x="642.5" y="581" font-size="17" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="success:detail">相同目标性质</text><text x="564" y="666" font-size="20" fill="#0f766e" font-weight="600" text-anchor="middle" data-semantic-id="adequate-point1">错误行为可表达、可达</text><text x="564" y="699" font-size="20" fill="#0f766e" font-weight="600" text-anchor="middle" data-semantic-id="adequate-point2">负向失败，修正后通过</text></g><g id="annotations"><rect x="25" y="790" width="710" height="49" rx="11" fill="#f3f7fc" stroke="#cbd5e1" stroke-width="1.6" data-semantic-id="bottom-principle"/><text x="380" y="821" font-size="21" fill="#0f172a" font-weight="600" text-anchor="middle" data-semantic-id="bottom-principle-text">先让错误能被检查到，再解释 PASS 的证据范围</text></g></svg>