<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="626" viewBox="0 0 1180 626" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif"><title id="title">从 TLC 反例到受控回归测试</title><desc id="desc">模型状态轨迹被解释为领域事件链，在实现边界固定事件顺序，再用受控测试重现相同故障；各层之间是映射而不是自动证明。</desc><defs><marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8a8d94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#08786c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="1" y="1" width="1178" height="624" rx="24" fill="#ffffff" stroke="#dcdfe4" stroke-width="2"/></g><g id="edges"><line x1="54" y1="260" x2="265" y2="260" stroke="#e8eaee" stroke-width="1.8" stroke-linecap="round" data-semantic-id="tlc-divider"/><path d="M291 280 H309.67" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="tlc-&gt;event"/><line x1="339.67" y1="260" x2="550.6700000000001" y2="260" stroke="#e8eaee" stroke-width="1.8" stroke-linecap="round" data-semantic-id="event-divider"/><path d="M576.6700000000001 280 H595.34" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="event-&gt;seam"/><line x1="625.34" y1="260" x2="836.34" y2="260" stroke="#e8eaee" stroke-width="1.8" stroke-linecap="round" data-semantic-id="seam-divider"/><path d="M862.34 280 H881.01" fill="none" stroke="#8a8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="seam-&gt;test"/><line x1="911.01" y1="260" x2="1122.01" y2="260" stroke="#e8eaee" stroke-width="1.8" stroke-linecap="round" data-semantic-id="test-divider"/><line x1="40" y1="446" x2="1140" y2="446" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="divider"/></g><g id="semantic-elements"><text x="48" y="68" font-size="32" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="diagram-title">从 TLC 反例到受控回归测试</text><text x="48" y="108" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="diagram-subtitle">把抽象的状态轨迹转成可以在代码中重现的事件顺序</text><rect x="34" y="158" width="251" height="244" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="tlc"/><text x="56" y="201" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="tlc-index">01</text><text x="56" y="241" font-size="26" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="tlc-title">TLC 反例</text><text x="56" y="295" font-size="19" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="tlc-role">状态序列</text><text x="56" y="336" font-size="18" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="tlc-detail1">旧操作仍在运行</text><text x="56" y="368" font-size="18" fill="#d64944" font-weight="600" text-anchor="start" data-semantic-id="tlc-detail2">违反提交权限性质</text><rect x="319.67" y="158" width="251" height="244" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="event"/><text x="341.67" y="201" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="event-index">02</text><text x="341.67" y="241" font-size="26" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="event-title">领域事件</text><text x="341.67" y="295" font-size="19" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="event-role">事件顺序</text><text x="341.67" y="336" font-size="18" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="event-detail1">启动操作 → 替换资源</text><text x="341.67" y="368" font-size="18" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="event-detail2">→ 旧回调到达</text><rect x="605.34" y="158" width="251" height="244" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="seam"/><text x="627.34" y="201" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="seam-index">03</text><text x="627.34" y="241" font-size="26" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="seam-title">实现边界</text><text x="627.34" y="295" font-size="19" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="seam-role">映射到代码</text><text x="627.34" y="336" font-size="18" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="seam-detail1">callback handler</text><text x="627.34" y="368" font-size="18" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="seam-detail2">commit guard</text><rect x="891.01" y="158" width="251" height="244" rx="15" fill="#eef8f5" stroke="#a7d1c7" stroke-width="1.5" data-semantic-id="test"/><text x="913.01" y="201" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="test-index">04</text><text x="913.01" y="241" font-size="26" fill="#08786c" font-weight="700" text-anchor="start" data-semantic-id="test-title">受控回归测试</text><text x="913.01" y="295" font-size="19" fill="#62666d" font-weight="500" text-anchor="start" data-semantic-id="test-role">固定事件顺序</text><text x="913.01" y="336" font-size="18" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="test-detail1">暂停回调 → 替换资源</text><text x="913.01" y="368" font-size="18" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="test-detail2">释放回调 → 检查状态</text><text x="46" y="498" font-size="22" fill="#08786c" font-weight="700" text-anchor="start" data-semantic-id="conclusion-head">检查重点</text><text x="182" y="498" font-size="22" fill="#17191d" font-weight="500" text-anchor="start" data-semantic-id="conclusion-one">身份、事件先后关系、违反的性质，在模型与测试中保持一致。</text><text x="46" y="549" font-size="22" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="conclusion-two">正常路径测试通过，并不能替代这条反例对应的受控测试。</text></g><g id="annotations"></g></svg>