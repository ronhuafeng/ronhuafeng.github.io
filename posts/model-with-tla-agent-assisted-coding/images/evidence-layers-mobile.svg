<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1190" viewBox="0 0 520 1190" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif"><title id="title">移动端：模型与实现验证的五层证据</title><desc id="desc">Requirements model、refinement、受控实现测试、外部验证和稳定终态都是不同的证据，不可互相取代。</desc><defs><marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8a8d94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#08786c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="1" y="1" width="518" height="1188" rx="24" fill="#ffffff" stroke="#dcdfe4" stroke-width="2"/></g><g id="edges"><line x1="37" y1="1067" x2="483" y2="1067" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="footer-rule"/></g><g id="semantic-elements"><text x="34" y="58" font-size="28" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="diagram-title">模型 PASS ≠ 完成验证</text><text x="34" y="95" font-size="18" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="diagram-subtitle">五类证据需要语义对齐</text><rect x="37" y="138" width="446" height="164" rx="15" fill="#f6f8fc" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-0"/><text x="57" y="177" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-0">01</text><text x="57" y="218" font-size="23" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="label-0">Requirements model</text><text x="57" y="255" font-size="20" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="detail-0-0">定义允许与禁止的抽象行为</text><rect x="37" y="321" width="446" height="164" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-1"/><text x="57" y="360" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-1">02</text><text x="57" y="401" font-size="23" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="label-1">Refinement / focused obligation</text><text x="57" y="438" font-size="20" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="detail-1-0">检查低层映射或一个关键边界</text><rect x="37" y="504" width="446" height="164" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-2"/><text x="57" y="543" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-2">03</text><text x="57" y="584" font-size="23" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="label-2">Controlled implementation trace</text><text x="57" y="621" font-size="20" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="detail-2-0">用受控调度验证实现中的事件顺序</text><rect x="37" y="687" width="446" height="164" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-3"/><text x="57" y="726" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-3">04</text><text x="57" y="767" font-size="23" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="label-3">External evidence</text><text x="57" y="804" font-size="20" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="detail-3-0">确认外部系统的事实及环境假设</text><rect x="37" y="870" width="446" height="164" rx="15" fill="#ffffff" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="layer-4"/><text x="57" y="909" font-size="18" fill="#8a8d94" font-weight="700" text-anchor="start" data-semantic-id="index-4">05</text><text x="57" y="950" font-size="23" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="label-4">Convergence observation</text><text x="57" y="987" font-size="20" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="detail-4-0">观察稳定、如实的最终状态</text><text x="42" y="1108" font-size="23" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="status-head">结论分类</text><text x="42" y="1143" font-size="21" fill="#08786c" font-weight="600" text-anchor="start" data-semantic-id="status-a">closed / scoped / drifted</text><text x="42" y="1172" font-size="21" fill="#08786c" font-weight="600" text-anchor="start" data-semantic-id="status-b">blocked / unproved</text></g><g id="annotations"></g></svg>