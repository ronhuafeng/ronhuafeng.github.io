<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="514" viewBox="0 0 1180 514" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif"><title id="title">常规 Agent coding loop：一个依赖测试覆盖的反馈循环</title><desc id="desc">需求、生成实现、编写测试、执行测试、根据失败修改代码；若重要时序错误没有进入测试，反馈循环可能没有机会发现它。</desc><defs><marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#8a8d94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#08786c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="1" y="1" width="1178" height="512" rx="24" fill="#ffffff" stroke="#dcdfe4" stroke-width="2"/></g><g id="edges"><path d="M234 201.5 H252.75" fill="none" stroke="#8a8d94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-0"/><path d="M455.75 201.5 H474.5" fill="none" stroke="#8a8d94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-1"/><path d="M677.5 201.5 H696.25" fill="none" stroke="#8a8d94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-2"/><path d="M899.25 201.5 H918" fill="none" stroke="#8a8d94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)" data-semantic-id="forward-3"/><path d="M1023 253 V302 H357.75 V261" fill="none" stroke="#08786c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" data-semantic-id="feedback-path"/><line x1="44" y1="344" x2="1136" y2="344" stroke="#e8eaee" stroke-width="2" stroke-linecap="round" data-semantic-id="separation"/></g><g id="semantic-elements"><text x="48" y="68" font-size="32" fill="#17191d" font-weight="700" text-anchor="start" data-semantic-id="diagram-title">一般的 Agent coding loop</text><text x="48" y="108" font-size="21" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="diagram-subtitle">从需求到测试，再根据失败修订实现</text><rect x="43" y="155" width="186" height="93" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-1"/><text x="136" y="211" font-size="25" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-0">需求</text><rect x="264.75" y="155" width="186" height="93" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-2"/><text x="357.75" y="211" font-size="25" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-1">生成实现</text><rect x="486.5" y="155" width="186" height="93" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-3"/><text x="579.5" y="211" font-size="25" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-2">编写测试</text><rect x="708.25" y="155" width="186" height="93" rx="15" fill="#f8f9fb" stroke="#dcdfe4" stroke-width="1.5" data-semantic-id="step-4"/><text x="801.25" y="211" font-size="25" fill="#17191d" font-weight="650" text-anchor="middle" data-semantic-id="step-label-3">执行测试</text><rect x="930" y="155" width="186" height="93" rx="15" fill="#eef8f5" stroke="#a7d1c7" stroke-width="1.5" data-semantic-id="step-5"/><text x="1023" y="192" font-size="23" fill="#08786c" font-weight="650" text-anchor="middle" data-semantic-id="step-label-4-0">根据失败</text><text x="1023" y="225" font-size="23" fill="#08786c" font-weight="650" text-anchor="middle" data-semantic-id="step-label-4-1">修改代码</text><text x="53" y="387" font-size="22" fill="#d64944" font-weight="700" text-anchor="start" data-semantic-id="assumption-name">隐含前提</text><text x="188" y="387" font-size="23" fill="#17191d" font-weight="600" text-anchor="start" data-semantic-id="assumption">测试能够覆盖重要的错误行为</text><text x="53" y="437" font-size="22" fill="#62666d" font-weight="400" text-anchor="start" data-semantic-id="limitation">若某种事件交错从未进入测试，这条反馈环就可能始终看不到它。</text></g><g id="annotations"><rect x="556" y="286" width="156" height="31" rx="9" fill="#ffffff" stroke="none" stroke-width="0" data-semantic-id="feedback-label-back"/><text x="635" y="309" font-size="19" fill="#08786c" font-weight="600" text-anchor="middle" data-semantic-id="feedback-label">失败反馈</text></g></svg>