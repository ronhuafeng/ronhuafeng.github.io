<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 890" width="760" height="890" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="title desc"><title id="title">一次 API 调用不等于一个原子动作</title><desc id="desc">一次 createResource 请求经历意图记录、外部调用、外部接受和结果交付。外部效果可能已经发生而响应丢失；这时调用者只知道结果未知，仍需保留效果责任，而不是直接假定请求没有执行。</desc><defs><marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0b8278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#bc662d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="background"><rect x="0" y="0" width="760" height="890" rx="23" fill="#fcfdff" stroke="#e2e8f0" stroke-width="2"/></g><g id="relationships"><path d="M380 223 L380 258" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="intent-&gt;request"/><path d="M380 359 L380 394" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="request-&gt;accepted"/><path d="M380 492 V517 H194 V551" fill="none" stroke="#64748b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="accepted-&gt;delivered"/><path d="M380 517 H566 V551" fill="none" stroke="#bc662d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" data-semantic-id="accepted-&gt;lost"/><path d="M193.5 651 L193.5 691" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-semantic-id="delivered-&gt;commit"/><path d="M566.5 651 L566.5 691" fill="none" stroke="#bc662d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" data-semantic-id="lost-&gt;unknown"/></g><g id="semantic-nodes"><text x="32" y="57" font-size="30" fill="#0f172a" font-weight="700" text-anchor="start" data-semantic-id="headline">一次 API 调用，不等于一个原子动作</text><text x="33" y="91" font-size="19" fill="#64748b" font-weight="400" text-anchor="start" data-semantic-id="subtitle">以有外部副作用的 createResource() 为例</text><rect x="90" y="131" width="580" height="89" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" data-semantic-id="intent"/><text x="380" y="166" font-size="24" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="intent:title">记录操作意图</text><text x="380" y="195" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="intent:detail">将操作绑定到可追踪的身份</text><rect x="90" y="267" width="580" height="89" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" data-semantic-id="request"/><text x="380" y="302" font-size="24" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="request:title">发起外部请求</text><text x="380" y="331" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="request:detail">此时不能假定外部操作已完成</text><rect x="90" y="403" width="580" height="89" rx="14" fill="#e8f5f2" stroke="#8bc8bd" stroke-width="2" data-semantic-id="accepted"/><text x="380" y="438" font-size="24" fill="#0f766e" font-weight="700" text-anchor="middle" data-semantic-id="accepted:title">外部系统接受请求</text><text x="380" y="467" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="accepted:detail">效果可能已经出现；这是关键 cut point</text><rect x="34" y="563" width="319" height="85" rx="14" fill="#ecf5ff" stroke="#a5c8ed" stroke-width="2" data-semantic-id="delivered"/><text x="193.5" y="598" font-size="23" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="delivered:title">响应送达</text><text x="193.5" y="627" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="delivered:detail">已获得可检查的结果</text><rect x="407" y="563" width="319" height="85" rx="14" fill="#fff4e9" stroke="#edbc93" stroke-width="2" data-semantic-id="lost"/><text x="566.5" y="598" font-size="23" fill="#a35125" font-weight="700" text-anchor="middle" data-semantic-id="lost:title">响应丢失 / 超时</text><text x="566.5" y="627" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="lost:detail">调用者无法确认结果</text><rect x="34" y="700" width="319" height="91" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" data-semantic-id="commit"/><text x="193.5" y="735" font-size="22" fill="#0f172a" font-weight="700" text-anchor="middle" data-semantic-id="commit:title">检查权限后提交</text><text x="193.5" y="764" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="commit:detail">匹配当前身份与操作</text><rect x="407" y="700" width="319" height="91" rx="14" fill="#fff4e9" stroke="#edbc93" stroke-width="2" data-semantic-id="unknown"/><text x="566.5" y="735" font-size="22" fill="#a35125" font-weight="700" text-anchor="middle" data-semantic-id="unknown:title">保留责任并查证</text><text x="566.5" y="764" font-size="18" fill="#475569" font-weight="400" text-anchor="middle" data-semantic-id="unknown:detail">对账、清理或按协议重试</text></g><g id="annotations"><rect x="25" y="824" width="710" height="48" rx="11" fill="#f9fbfd" stroke="#e2e8f0" stroke-width="1" data-semantic-id="bottom-boundary"/><text x="380" y="854" font-size="21" fill="#0f172a" font-weight="600" text-anchor="middle" data-semantic-id="boundary-note">超时 ≠ 未执行；取消 ≠ 外部效果消失</text></g></svg>